; ----------- Nordic nRF52840 Dongle (PCA10059) ------------
; no LoRa module, uses the nRF52 2.4GHz radio to reach a repeater
; compiled with WITH_NRF52_WIRELESS_BRIDGE (see NRF52WirelessRadio.h)
; needs the Adafruit nRF52 bootloader (PCA10059, SoftDevice S140 6.1.1)

[PCA10059]
extends = nrf52_base
board = PCA10059
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${nrf52_base.build_flags}
  -I variants/PCA10059
  -D PCA10059
  -D LORA_TX_POWER=4         ; 2.4GHz TX power, dBm
  -D MAX_LORA_TX_POWER=8
;  -D NRF52_WIRELESS_CHANNEL=1              ; must match repeater bridge.channel
;  -D NRF52_WIRELESS_SECRET='"LVSITANOS"'   ; must match repeater bridge.secret
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/nrf52/NRF52WirelessRadio.cpp>
  +<../variants/PCA10059>

[env:PCA10059_companion_wirelessbridge_usb]
extends = PCA10059
build_flags =
  ${PCA10059.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${PCA10059.build_src_filter}
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${PCA10059.lib_deps}
  densaugeo/base64 @ ~1.4.0
